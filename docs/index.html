<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Danses country</title>
  <link rel="stylesheet" href="app.css">
  <link rel="preconnect" href="https://www.youtube-nocookie.com">
</head>
<body>
  <aside class="nav">
    <button class="brand" id="brand" type="button">Danses country</button>
    <nav class="menu" aria-label="Sections">
      <button type="button" data-route="#/danses">Danses</button>
      <button type="button" data-route="#/chansons">Chansons</button>
      <button type="button" data-route="#/groupes">Groupes</button>
      <button type="button" data-route="#/playlists">Listes de lecture</button>
      <button type="button" data-route="#/repertoires">Listes</button>
      <button id="nouvelle" class="nouvelle" type="button">Nouvelle danse</button>
    </nav>
  </aside>
  <div class="app">
    <header class="top">
      <form id="search-form" role="search">
        <input id="q" type="search" placeholder="Une danse, une musique, un artiste…" autocomplete="off" aria-autocomplete="list">
      </form>
      <div id="lecteur" class="lecteur" hidden>
        <iframe id="yt" title="Lecture" allow="autoplay; encrypted-media"></iframe>
        <p id="lecteur-titre"></p>
        <button id="lecteur-play" type="button">Lecture</button>
        <button id="lecteur-pause" type="button">Pause</button>
        <button id="lecteur-stop" type="button">Arrêt</button>
      </div>
    </header>
    <main id="view"></main>
  </div>
  <script src="data.js"></script>
  <script src="apercu.js"></script>
  <script src="app.js"></script>
</body>
</html>
